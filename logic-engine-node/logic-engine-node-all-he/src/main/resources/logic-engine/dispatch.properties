#   dubbo: \u57FA\u4E8E Dubbo \u5B9E\u73B0\u7684\u8C03\u5EA6\u5668\uFF0C\u5229\u7528\u670D\u52A1\u63D0\u4F9B\u8005\u673A\u5236\u5B9E\u73B0\u591A\u4E2A\u63A5\u6536\u8282\u70B9\u7684\u8D1F\u8F7D\u5747\u8861\u3002
#
# \u5BF9\u4E8E\u4E00\u4E2A\u5177\u4F53\u7684\u9879\u76EE\uFF0C\u5F88\u53EF\u80FD\u53EA\u4F7F\u7528\u4E00\u4E2A\u8C03\u5EA6\u5668\u3002\u6B64\u65F6\u5982\u679C\u5E0C\u671B\u7A0B\u5E8F\u52A0\u8F7D\u65F6\u53EA\u52A0\u8F7D\u4E00\u4E2A\u8C03\u5EA6\u5668\uFF0C\u53EF\u4EE5\u901A\u8FC7\u7F16\u8F91
# opt/opt-dispatcher.xml \u6587\u4EF6\u5B9E\u73B0\u3002
